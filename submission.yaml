submission:
  title:Teach-Titans                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
   Mission Readiness & Predictive Maintenance Copilot is an AI-powered dashboard
   that analyzes sensor and maintenance data to predict equipment health, 
   Remaining Useful Life (RUL), and readiness status.
   It helps maintenance officers identify at-risk assets, prioritize maintenance, 
   and take proactive actions before failures occur.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
AI-based Remaining Useful Life (RUL) prediction for equipment
 Ready, Watch, and Critical mission-readiness classification
 Component failure risk identification and explanation
 Prioritized maintenance planning and scheduling
 Maintenance records stored and managed using SQLite database

  key_features: 
  - "AI-based Remaining Useful Life (RUL) prediction for equipment"
  - "Mission readiness classification into Ready, Watch, and Critical"
  - "Component failure risk identification and explanation"
  - "Prioritized maintenance planning and scheduling"
  - "Maintenance decision storage using SQLite database"

  tech_stack:
    languages: Python, JavaScript (JSX)                      
    frameworks: React, Vite, Flask, Express.js                 
    ibm_technologies: IBM Bob              
    databases: SQLLite                   
    other: Scikit-learn, Pandas, NumPy, Joblib, Tailwind CSS, Recharts                        

  what_we_are_most_proud_of: >         
   We are most proud of turning raw sensor data into actionable maintenance decisions.
   Our system combines RUL prediction, readiness classification, risk identification, and maintenance scheduling in one dashboard, helping maintenance 
   officers move from reactive maintenance to proactive, data-driven decisions.

  known_limitations: >                
  Component failure prediction is currently rule-based/associated with asset risk, rather than a separately trained component-level ML model.
 Asset and maintenance data are prototype/demo data and are not connected to real military equipment systems.
 The ML models are proof-of-concept models trained on the provided sensor dataset and would require more real-world data and validation for production deployment.

