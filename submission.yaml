submission:
  title: "Mission Readiness & Predictive Maintenance Copilot"

  problem_statement: >
    Military maintenance teams often rely on fixed maintenance schedules
    instead of actual equipment condition, making it difficult to identify
    failures before they affect mission readiness. Sensor and maintenance data
    can contain early warning signals, but these signals are often difficult
    to analyze and act on quickly.

  solution_summary: >
    We built an AI-powered dashboard that analyzes equipment sensor data to
    predict Remaining Useful Life (RUL) and classify assets as Ready, Watch,
    or Critical. The system identifies at-risk assets, provides maintenance
    recommendations, and allows officers to schedule and store maintenance
    decisions.

  key_features:
    - "AI-based Remaining Useful Life (RUL) prediction for equipment"
    - "Mission readiness classification into Ready, Watch, and Critical"
    - "Component failure risk identification and explanation"
    - "Prioritized maintenance planning and scheduling"
    - "Maintenance decision storage using SQLite database"

  tech_stack:
    languages: ["Python", "JavaScript", "JSX"]
    frameworks: ["React", "Vite", "Flask", "Express.js"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite"]
    other: ["Scikit-learn", "Pandas", "NumPy", "Joblib", "Tailwind CSS", "Recharts"]

  what_we_are_most_proud_of: >
    We are most proud of turning raw sensor data into actionable maintenance
    decisions through a single dashboard. The system combines RUL prediction,
    readiness classification, risk identification, and maintenance scheduling
    to support proactive, data-driven maintenance decisions.

  known_limitations: >
    Component failure prediction is currently associated with asset risk rather
    than being a separately trained component-level ML model. The asset and
    maintenance data are prototype/demo data, and the ML models would require
    additional real-world data and validation for production deployment.

